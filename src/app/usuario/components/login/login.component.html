<!-- CONTENEDOR CENTRAL -->
<div class="bg-gray-50 px-6 flex" style="height: calc(100vh - 90px);">
  <div class="m-auto w-full max-w-[500px] bg-white rounded-xl shadow-xl overflow-hidden" [@fadeInUp]>

    <!-- ENCABEZADO -->
    <div class="bg-[#191919] text-white px-6 py-4 rounded-t-xl text-center">
      <h2 class="text-2xl font-bold tracking-wide">INICIAR SESIÓN</h2>
    </div>

    <!-- CONTENIDO -->
    <div class="p-6 space-y-6">

      <!-- LOGIN CON PROVEEDORES -->
      <div class="flex flex-col items-center space-y-4">
        <p class="text-sm text-gray-600">Accede rápidamente con:</p>
        <app-boton-proveedor></app-boton-proveedor>
        <div class="relative w-full text-center">
          <hr class="border-gray-300">
          <span class="absolute top-[-12px] left-1/2 transform -translate-x-1/2 bg-white px-2 text-sm text-gray-500">
            o con tu cuenta
          </span>
        </div>
      </div>

      <!-- FORMULARIO -->
      <form [formGroup]="usuario" (ngSubmit)="confirmar()" class="space-y-4">
        <app-campos-formulario [camposFormulario]="camposFormulario" [camposValidacion]="camposValidacion"
          [formulario]="usuario" tituloFormulario="Iniciar Sesión">
        </app-campos-formulario>

        <!-- BOTONES -->
        <div class="flex flex-col gap-3 cursor-pointer mt-6">
          <button type="submit" [ngClass]="{
              'bg-[#191919] hover:bg-black text-white': usuario.valid || cargando,
              'bg-[#5e5e5e] text-gray-300': usuario.invalid || cargando
            }" class="py-2 px-4 rounded-md transition duration-300 w-full cursor-pointer">
            Ingresar
          </button>
        </div>

        <!-- REGISTRO -->
        <div class="text-center mt-6">
          <p class="text-sm text-gray-600">
            ¿No tienes cuenta?
            <a routerLink="/registrarse" class="text-black hover:underline font-medium ml-1">
              Registrarte
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
