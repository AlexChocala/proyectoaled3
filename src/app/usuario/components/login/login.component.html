<!-- CONTENEDOR CENTRAL -->
<div class="bg-gray-50 px-6 flex" style="height: calc(100vh - 90px);">
  <div class="m-auto w-full max-w-[500px] bg-white rounded-xl shadow-xl overflow-hidden" [@fadeInUp]>


    <!-- ENCABEZADO -->
    <div class="bg-[#191919] text-white px-6 py-4 rounded-t-xl text-center">
      <h2 class="text-2xl font-bold tracking-wide">INICIAR SESIÓN</h2>
    </div>

    <!-- CONTENIDO -->
    <div class="p-6 space-y-6">

      <!-- LOGIN CON PROVEEDORES -->
      <div class="flex flex-col items-center space-y-4">
        <p class="text-sm text-gray-600">Accede rápidamente con:</p>
        <app-boton-proveedor></app-boton-proveedor>
        <div class="relative w-full text-center">
          <hr class="border-gray-300 my-4" >
          <span class="absolute top-[-12px] left-1/2 transform -translate-x-1/2 bg-white px-2 text-sm text-gray-500">
            o con tu cuenta
          </span>
        </div>
      </div>

      <!-- FORMULARIO -->
      <form [formGroup]="usuario" (ngSubmit)="confirmar()" class="space-y-6">

        <!-- EMAIL -->
        <div [@fadeInUp]>
          <label for="email" class="block text-sm font-medium text-gray-700">EMAIL</label>
          <div class="relative mt-1">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-[#191919]">
              <i-lucide name="mail" class="w-5 h-5"></i-lucide>
            </span>
            <input id="email" type="text" formControlName="email" placeholder="nombre@gmail.com" required
              class="pl-10 pr-4 py-2 w-full border border-gray-300 rounded-md outline-none transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-black focus:border-black" />
          </div>
          <ng-container *ngTemplateOutlet="validaCampo; context: { campo: 'email' }"></ng-container>
        </div>

        <!-- CONTRASEÑA -->
        <div [@fadeInUp]>
          <label for="contrasena" class="block text-sm font-medium text-gray-700">CONTRASEÑA</label>
          <div class="relative mt-1">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-[#191919]">
              <i-lucide name="lock" class="w-5 h-5"></i-lucide>
            </span>
            <input id="contrasena" [type]="hide() ? 'password' : 'text'" formControlName="contrasena"
              placeholder="••••••••" required
              class="pl-10 pr-10 py-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-black transition-all duration-300" >
            <button type="button" (click)="clickEvent($event)"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-[#191919]"
              [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide()">
              <i-lucide [name]="hide() ? 'eye' : 'eye-off'" class="w-5 h-5 cursor-pointer"></i-lucide>
            </button>
          </div>
          <ng-container *ngTemplateOutlet="validaCampo; context: { campo: 'contrasena' }"></ng-container>
        </div>

        <!-- BOTONES -->
        <div class="flex flex-col gap-3">
          <button type="button" (click)="confirmar()" [ngClass]="{
            'bg-[#191919] hover:bg-black text-white': usuario.valid,
            'bg-[#5e5e5e] text-gray-300': usuario.invalid
          }" class="py-2 px-4 rounded-md transition duration-300 w-full cursor-pointer">
            Ingresar
          </button>
        </div>

        <!-- REGISTRO -->
        <div class="text-center mt-6">
          <p class="text-sm text-gray-600">
            ¿No tienes cuenta?
            <a routerLink="/registrarse" class="text-black hover:underline font-medium ml-1">
              REGISTRATE
            </a>
          </p>
        </div>
      </form>

      <!-- VALIDACIÓN -->
      <ng-template #validaCampo let-campo="campo">
        @if (getError(campo)) {
        <p class="text-red-500 text-sm mt-1">{{ getError(campo) }}</p>
        }
      </ng-template>
    </div>
  </div>
</div>
