@if (mostrarFooter) {
<footer class="w-full bg-[#191919] text-white mt-auto">
  <div class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">


    <div class="flex flex-col items-center sm:items-start gap-4 text-center sm:text-left">
      <div class="flex items-center gap-2 text-sm">
        <i-lucide name="copyright" class="w-4 h-4"></i-lucide>
        <span>2025 © Todos los derechos reservados</span>
      </div>
      <p class="text-sm text-gray-400">
        Proyecto <span class="font-semibold">• ALED 3</span>
      </p>
    </div>

    <!-- Navegación rápida (centrado) -->
    <div class="flex flex-col items-center gap-2 text-sm text-center">
      <h3 class="font-semibold mb-2">Navegar</h3>
      <ul class="space-y-1">
        <li><a [routerLink]="'/producto'" class="hover:text-gray-300 transition">Productos</a></li>
        <li><a [routerLink]="'/chat'" class="hover:text-gray-300 transition">Chat</a></li>
      </ul>
    </div>

    <!-- Redes sociales (alineado a la derecha) -->
    <div class="flex flex-col items-center sm:items-end gap-2 text-center sm:text-right">
      <h3 class="font-semibold mb-2 text-sm">Síguenos</h3>
      <div class="flex space-x-4 text-xl">
        <a href="#" class="hover:text-gray-300 transition" aria-label="Facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="#" class="hover:text-gray-300 transition" aria-label="Twitter">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="#" class="hover:text-gray-300 transition" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="#" class="hover:text-gray-300 transition" aria-label="LinkedIn">
          <i class="fab fa-linkedin-in"></i>
        </a>
      </div>
    </div>
  </div>
  <!-- Línea inferior -->
  <div class="border-t border-gray-700 text-center py-4 text-xs text-gray-400">
    Fronted: Alex Chocala - Backend: Francisco Gallardo
  </div>
</footer>
}
